name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve Norm toolchain
        id: toolchain
        run: |
          ref=$(sed -n 's/^      norm-source-ref: //p' .github/workflows/package.yml)
          test "${#ref}" -eq 40
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: normlanguage/registry/.github/actions/setup-norm@c42fcb813fd549d179896d358eb774543a9b6c0d
        with:
          source-ref: ${{ steps.toolchain.outputs.ref }}
      - name: Package current module
        run: |
          norm package micronaut/web/module.norm --output build/repository
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify package behavior
        run: node scripts/test.mjs "$(command -v norm)"
