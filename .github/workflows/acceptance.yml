name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve Norm toolchain
        id: toolchain
        run: |
          ref=$(sed -n 's/^      norm-source-ref: //p' .github/workflows/package.yml)
          test "${#ref}" -eq 40
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: normlanguage/Norm
          ref: ${{ steps.toolchain.outputs.ref }}
          path: .norm-toolchain
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Norm toolchain
        working-directory: .norm-toolchain
        run: |
          chmod +x gradlew
          ./gradlew :compiler:installRuntimeDist --no-daemon
          echo "$GITHUB_WORKSPACE/.norm-toolchain/build/compiler/norm-runtime/bin" >> "$GITHUB_PATH"
      - name: Package current module
        run: |
          norm package micronaut/web/module.norm --output build/repository
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify package behavior
        run: node scripts/test.mjs "$(command -v norm)"
