name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install released Norm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.21.2 --repo normlanguage/Norm --pattern norm-v0.21.2-linux-x64.tar.gz --pattern SHA256SUMS --dir "$RUNNER_TEMP/norm-cli"
          (cd "$RUNNER_TEMP/norm-cli" && grep ' norm-v0.21.2-linux-x64.tar.gz$' SHA256SUMS | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/norm-cli/norm-v0.21.2-linux-x64.tar.gz" -C "$RUNNER_TEMP/norm-cli"
          echo "$RUNNER_TEMP/norm-cli/norm/bin" >> "$GITHUB_PATH"
      - name: Package current module
        run: |
          norm package micronaut/web/module.norm --output build/repository
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify package behavior
        run: norm test examples/acceptance/default.norm
