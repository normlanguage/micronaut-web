name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve Norm toolchain
        id: toolchain
        run: |
          source_ref=$(sed -n 's/^      norm-source-ref: //p' .github/workflows/package.yml)
          test -n "$source_ref"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: ${{ steps.toolchain.outputs.source_ref }}
      - name: Package current module
        run: |
          norm package micronaut/web/module.norm --output build/repository
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify package behavior
        run: node scripts/test.mjs "$(command -v norm)"



